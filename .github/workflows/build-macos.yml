name: Build TokenDesk macOS package

on:
  push:
    branches: [ main ]
    paths:
      - '*.swift'
      - '*.plist'
      - '*.command'
      - 'Chrome_Extension/**'
      - 'tests/**'
      - 'README*.md'
      - 'INSTALL_FIRST.txt'
      - '先读我_网页同步安装指南.md'
      - '版本修复说明_*.txt'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in *.command; do
            bash -n "$f"
          done

      - name: Run Chrome extension tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.cjs; do
            node "$f"
          done

      - name: Typecheck macOS Swift sources
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -typecheck \
            QuotaModels.swift BrowserUsage.swift BrowserBridge.swift TokenDeskApp.swift \
            -framework SwiftUI -framework AppKit -framework Network -framework UserNotifications

      - name: Generate app icon assets
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          NSColor(calibratedRed: 0.071, green: 0.114, blue: 0.188, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()

          let border = NSBezierPath(roundedRect: NSRect(x: 52, y: 52, width: 920, height: 920),
                                    xRadius: 190, yRadius: 190)
          border.lineWidth = 9
          NSColor(calibratedRed: 0.33, green: 0.37, blue: 0.45, alpha: 1).setStroke()
          border.stroke()

          let arc = NSBezierPath()
          arc.appendArc(withCenter: NSPoint(x: 512, y: 512),
                        radius: 246,
                        startAngle: 43,
                        endAngle: 315,
                        clockwise: true)
          arc.lineWidth = 84
          arc.lineCapStyle = .square
          NSColor(calibratedRed: 0.39, green: 0.88, blue: 0.76, alpha: 1).setStroke()
          arc.stroke()

          let center = NSBezierPath(roundedRect: NSRect(x: 443, y: 434, width: 128, height: 156),
                                    xRadius: 28, yRadius: 28)
          NSColor(calibratedRed: 0.39, green: 0.88, blue: 0.76, alpha: 1).setFill()
          center.fill()

          let bar = NSBezierPath(roundedRect: NSRect(x: 612, y: 381, width: 60, height: 198),
                                 xRadius: 27, yRadius: 27)
          NSColor(calibratedRed: 0.46, green: 0.58, blue: 0.91, alpha: 1).setFill()
          bar.fill()

          image.unlockFocus()
          let rep = NSBitmapImageRep(data: image.tiffRepresentation!)!
          let png = rep.representation(using: .png, properties: [:])!
          try! png.write(to: URL(fileURLWithPath: "TokenDeskIcon.png"))
          SWIFT
          xcrun swift /tmp/make_icon.swift

          mkdir -p TokenDesk.iconset
          for spec in "16 icon_16x16.png" "32 icon_16x16@2x.png" "32 icon_32x32.png" "64 icon_32x32@2x.png" "128 icon_128x128.png" "256 icon_128x128@2x.png" "256 icon_256x256.png" "512 icon_256x256@2x.png" "512 icon_512x512.png" "1024 icon_512x512@2x.png"; do
            set -- $spec
            sips -z "$1" "$1" TokenDeskIcon.png --out "TokenDesk.iconset/$2" >/dev/null
          done
          iconutil -c icns TokenDesk.iconset -o TokenDesk.icns

      - name: Create source installer package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/TokenDesk_v1.7.6"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/Chrome_Extension" "$ROOT/tests"

          cp QuotaModels.swift BrowserUsage.swift BrowserBridge.swift TokenDeskApp.swift Info.plist "$ROOT/"
          cp TokenDeskIcon.png TokenDesk.icns "$ROOT/"
          cp install.command 安装到Mac.command repair-launch.command 修复首次启动.command "$ROOT/"
          cp update-chrome.command 只更新Chrome扩展.command open-extension.command 打开浏览器扩展安装页.command "$ROOT/"
          cp INSTALL_FIRST.txt README.md README_中文.md SECURITY.md 先读我_网页同步安装指南.md "$ROOT/"
          cp 版本修复说明_1.7.6.txt "$ROOT/"
          cp Chrome_Extension/* "$ROOT/Chrome_Extension/"
          cp tests/* "$ROOT/tests/"

          chmod +x "$ROOT"/*.command
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" TokenDesk_Mac_v1.7.6_source.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenDesk-Mac-v1.7.6
          path: TokenDesk_Mac_v1.7.6_source.zip
          if-no-files-found: error
          retention-days: 30
