name: Build TokenDesk macOS package

on:
  push:
    branches: [ main ]
    paths:
      - '*.swift'
      - '*.plist'
      - '*.command'
      - 'Chrome_Extension/**'
      - 'tests/**'
      - 'README*.md'
      - 'INSTALL_FIRST.txt'
      - '先读我_网页同步安装指南.md'
      - '版本修复说明_*.txt'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in *.command; do
            bash -n "$f"
          done

      - name: Run Chrome extension tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.cjs; do
            node "$f"
          done

      - name: Typecheck macOS Swift sources
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -typecheck \
            QuotaModels.swift BrowserUsage.swift BrowserBridge.swift TokenDeskApp.swift \
            -framework SwiftUI -framework AppKit -framework Network -framework UserNotifications

      - name: Create source installer package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/TokenDesk_v1.7.6"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/Chrome_Extension" "$ROOT/tests"

          cp QuotaModels.swift BrowserUsage.swift BrowserBridge.swift TokenDeskApp.swift Info.plist "$ROOT/"
          cp install.command 安装到Mac.command repair-launch.command 修复首次启动.command "$ROOT/"
          cp update-chrome.command 只更新Chrome扩展.command open-extension.command 打开浏览器扩展安装页.command "$ROOT/"
          cp INSTALL_FIRST.txt README.md README_中文.md SECURITY.md 先读我_网页同步安装指南.md "$ROOT/"
          cp 版本修复说明_1.7.6.txt "$ROOT/"
          cp Chrome_Extension/* "$ROOT/Chrome_Extension/"
          cp tests/* "$ROOT/tests/"

          chmod +x "$ROOT"/*.command
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" TokenDesk_Mac_v1.7.6_source.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenDesk-Mac-v1.7.6
          path: TokenDesk_Mac_v1.7.6_source.zip
          if-no-files-found: error
          retention-days: 30
